<!-- BLOCO: Botao CTA -->
<!-- Botao centralizado com cantos arredondados (border-radius: 25px) -->
<!-- Duas variacoes de cor disponiveis. Use apenas UMA por vez. -->
<!--
  COMO TROCAR A COR DO BOTAO:
  - Amarelo (padrao): bgcolor="#eefc58", background-color:#eefc58, cor do texto #1e1b15
  - Teal:             bgcolor="#28C3C3", background-color:#28c3c3, cor do texto #ffffff
  Para usar o teal, comente a Variacao 1 e descomente a Variacao 2.
-->

<!-- ============================================================
     VARIACAO 1 (PADRAO): Botao Amarelo
     Cor de fundo: #eefc58 | Cor do texto: #1e1b15
     ============================================================ -->
<div class="hse-section" style="padding-left: 10px; padding-right: 10px">
  <div
    class="hse-column-container hse-border hse-border-m"
    style="
      min-width: 280px;
      max-width: 600px;
      margin: 0 auto;
      border-left: 1px solid #f5f5eb;
      border-right: 1px solid #f5f5eb;
      box-sizing: border-box;
      background-color: #ffffff;
    "
    bgcolor="#ffffff">
    <!--[if (mso)|(IE)]>
      <table align="center" style="width:600px;border-left:1px solid #F5F5EB;border-right:1px solid #F5F5EB" cellpadding="0" cellspacing="0" role="presentation" class="hse-border hse-border-m" width="600" bgcolor="#ffffff">
      <tr style="background-color:#ffffff;">
    <![endif]-->

    <!--[if (mso)|(IE)]>
  <td valign="top" style="width:598px;">
<![endif]-->
    <!--[if gte mso 9]>
  <table role="presentation" width="598" cellpadding="0" cellspacing="0" style="width:598px">
<![endif]-->
    <div class="hse-column hse-size-12">
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        width="100%">
        <tbody>
          <tr>
            <td
              class="hs_padded"
              style="
                font-family: Helvetica, Arial, sans-serif;
                font-size: 16px;
                color: #3c402b;
                word-break: break-word;
                padding: 20px;
              ">
              <div
                style="
                  color: inherit;
                  font-size: inherit;
                  line-height: inherit;
                ">
                <table
                  align="center"
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                  role="presentation"
                  style="border-collapse: separate !important">
                  <tbody>
                    <tr>
                      <td
                        align="center"
                        valign="middle"
                        bgcolor="#eefc58"
                        style="
                          font-family:
                            Helvetica, Arial, sans-serif;
                          font-size: 16px;
                          color: #3c402b;
                          word-break: break-word;
                          border-radius: 25px;
                          cursor: auto;
                          background-color: #eefc58;
                          mso-padding-alt: 12px 24px;
                        ">
                        <!-- EDITAR: Substitua o href pelo link de destino do botao -->
                        <a
                          href="#LINK_DO_BOTAO"
                          target="_blank"
                          style="
                            color: #00a4bd;
                            font-size: 16px;
                            font-family: Arial, sans-serif;
                            margin: 0;
                            text-transform: none;
                            text-decoration: none;
                            padding: 12px 24px;
                            display: block;
                          ">
                          <!-- EDITAR: Substitua o texto do botao -->
                          <strong
                            style="
                              color: #1e1b15;
                              font-weight: bold;
                              text-decoration: none;
                              font-style: normal;
                            "
                            >Texto do botao</strong
                          >
                        </a>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <!--[if gte mso 9]></table><![endif]-->
    <!--[if (mso)|(IE)]></td><![endif]-->

    <!--[if (mso)|(IE)]></tr></table><![endif]-->
  </div>
</div>
