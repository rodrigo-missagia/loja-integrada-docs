<!-- BLOCO: Divisor — Linha pontilhada horizontal -->
<!-- Separador visual entre seções de conteúdo -->
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="table-layout:fixed">
  <tbody>
    <tr>
      <td style="font-family:Helvetica,Arial,sans-serif;font-size:16px;color:#3c402b;word-break:break-word;padding:0px 20px;">
        <table role="none" border="0" cellpadding="0" cellspacing="0" style="vertical-align:top" width="100%">
          <tbody>
            <tr>
              <td align="center" style="font-family:Helvetica,Arial,sans-serif;color:#3c402b;font-size:0;word-break:break-word;">
                <p style="font-size:1px;border-top:1px dashed #d7d1c1;width:100%;margin:0 auto;"></p>
                <!--[if mso]>
                <table role="none" align="center" border="0" cellpadding="0" cellspacing="0" style="font-size:1px;border-top:1px dashed #d7d1c1;width:558px;">
                  <tr><td style="height:0;line-height:0;">&nbsp;</td></tr>
                </table>
                <![endif]-->
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
